<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="Zen Kaku Gothic New, Hiragino Sans, Yu Gothic UI, sans-serif">
  <!-- 地面 -->
  <rect width="900" height="480" fill="#eef6f3"/>
  <!-- 公園（みどりの森公園） -->
  <path d="M470 40 H860 V300 H600 Q520 300 470 240 Z" fill="#cdeccf"/>
  <g fill="#9fd9a8">
    <circle cx="520" cy="80" r="18"/><circle cx="560" cy="70" r="14"/><circle cx="820" cy="80" r="16"/>
    <circle cx="830" cy="260" r="18"/><circle cx="790" cy="275" r="13"/><circle cx="510" cy="200" r="15"/>
  </g>
  <text x="840" y="62" font-size="15" fill="#3f8a55" text-anchor="end" font-weight="700">みどりの森公園</text>
  <!-- 池 -->
  <ellipse cx="805" cy="150" rx="38" ry="26" fill="#bfe6f0"/>
  <!-- 川 -->
  <path d="M0 420 Q200 380 380 430 T900 410" stroke="#bfe6f0" stroke-width="26" fill="none"/>
  <text x="120" y="456" font-size="13" fill="#5aa9bd">みどり川</text>

  <!-- 道路 -->
  <g stroke="#ffffff" stroke-linecap="round">
    <path d="M0 330 H900" stroke-width="34"/>
    <path d="M300 0 V480" stroke-width="30"/>
    <path d="M300 160 H470" stroke-width="18"/>
  </g>
  <g stroke="#dfe7ea" stroke-width="2" stroke-dasharray="14 12">
    <path d="M0 330 H900"/><path d="M300 0 V480"/>
  </g>
  <text x="40" y="320" font-size="13" fill="#7a8a90">県道〇〇号線</text>
  <text x="312" y="40" font-size="13" fill="#7a8a90">市役所通り</text>

  <!-- 駅 -->
  <g transform="translate(60 210)">
    <rect width="150" height="56" rx="10" fill="#0d6f86"/>
    <text x="75" y="35" font-size="18" fill="#fff" text-anchor="middle" font-weight="700">〇〇駅</text>
  </g>
  <path d="M0 238 H60 M210 238 H285" stroke="#0d6f86" stroke-width="6" stroke-dasharray="18 8"/>

  <!-- コンビニ・学校 -->
  <g transform="translate(330 360)">
    <rect width="90" height="44" rx="8" fill="#fff" stroke="#c9d6db" stroke-width="2"/>
    <text x="45" y="28" font-size="14" fill="#5d6f78" text-anchor="middle">コンビニ</text>
  </g>
  <g transform="translate(120 40)">
    <rect width="130" height="70" rx="8" fill="#fff" stroke="#c9d6db" stroke-width="2"/>
    <text x="65" y="42" font-size="15" fill="#5d6f78" text-anchor="middle">〇〇中学校</text>
  </g>

  <!-- テニスセンター -->
  <g transform="translate(560 95)">
    <rect width="170" height="110" rx="12" fill="#1593b0"/>
    <rect x="16" y="16" width="64" height="78" rx="4" fill="#3fb0c9" stroke="#fff" stroke-width="3"/>
    <path d="M16 55 H80" stroke="#fff" stroke-width="3"/>
    <rect x="90" y="16" width="64" height="78" rx="4" fill="#3fb0c9" stroke="#fff" stroke-width="3"/>
    <path d="M90 55 H154" stroke="#fff" stroke-width="3"/>
  </g>
  <!-- 駐車場 -->
  <g transform="translate(480 120)">
    <rect width="64" height="64" rx="8" fill="#fff" stroke="#c9d6db" stroke-width="2"/>
    <text x="32" y="44" font-size="32" fill="#1593b0" text-anchor="middle" font-weight="900" font-family="Montserrat, sans-serif">P</text>
  </g>

  <!-- 道順 -->
  <path d="M210 250 H300 V160 H480" stroke="#ff9f45" stroke-width="6" fill="none" stroke-dasharray="2 12" stroke-linecap="round"/>

  <!-- ピン -->
  <g transform="translate(645 92)">
    <path d="M0 0 C-30 -40 -30 -80 0 -80 C30 -80 30 -40 0 0Z" fill="#ff7a3d" transform="scale(1.1)"/>
    <circle cx="0" cy="-58" r="12" fill="#fff"/>
  </g>
  <g transform="translate(560 225)">
    <rect width="230" height="40" rx="20" fill="#fff" stroke="#ff9f45" stroke-width="3"/>
    <text x="115" y="26" font-size="16" fill="#0d6f86" text-anchor="middle" font-weight="700">みどりの森テニスセンター</text>
  </g>

  <!-- 方位 -->
  <g transform="translate(70 380)">
    <circle r="26" fill="#fff" stroke="#c9d6db" stroke-width="2"/>
    <path d="M0 -18 L8 6 L0 0 L-8 6Z" fill="#ff7a3d"/>
    <text y="-30" font-size="12" text-anchor="middle" fill="#5d6f78" font-family="Montserrat, sans-serif" font-weight="700">N</text>
  </g>
</svg>
